server {
    listen 80;
    listen [::]:80;
    server_name pay-per.in www.pay-per.in;
    client_max_body_size 10G;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl; # Enable HTTP/2
    listen [::]:443 ssl; # Enable HTTP/2
    http2  on;
    server_name pay-per.in www.pay-per.in;
    client_max_body_size 10G;

    ssl_certificate /etc/letsencrypt/live/pay-per.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay-per.in/privkey.pem;
    ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;

    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3; # Removed TLSv1
    ssl_prefer_server_ciphers off; # Not needed with modern SSL protocols
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
   # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
   # add_header X-Content-Type-Options nosniff;
    #add_header X-Frame-Options SAMEORIGIN;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the entry point so each page load can discover a new build.
    # SPA routes above fall back to this file as well.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite fingerprints built asset filenames; unchanged assets can be reused.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $https;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }

    location /media/ {
        alias /mediafiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;  # Change this if your Django admin is served on a different port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $https;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }

    location /static/ {
    alias /staticfiles/;  # Replace with the actual path to your Django static files
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-CSRFToken $cookie_csrftoken;

}
}

# BEGIN TEMPORARY pay-per.me MIGRATION CONFIG
# Old domain expires on 2026-11-10 and will not be renewed.
# When retiring it, remove BOTH server blocks between these markers.
# Rebuild, validate, and recreate the frontend before deleting the .me
# certificate from Certbot, since these blocks still reference its files.
# Full cleanup instructions: docs/domain-migration.md
server {
    listen 80;
    listen [::]:80;
    server_name pay-per.me www.pay-per.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pay-per.me www.pay-per.me;
    client_max_body_size 10G;

    ssl_certificate /etc/letsencrypt/live/pay-per.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay-per.me/privkey.pem;
    ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    # An internal redirect keeps the original browser path for the notice's link.
    location / {
        root /usr/share/nginx/html;
        rewrite ^ /domain-moved.html last;
    }

    location = /domain-moved.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Existing open tabs can finish requests during the transition.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /media/ {
        alias /mediafiles/;
        expires 30d;
    }

    location /static/ {
        alias /staticfiles/;
        expires 30d;
    }
}
# END TEMPORARY pay-per.me MIGRATION CONFIG
